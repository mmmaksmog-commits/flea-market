<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Барахолка — игра в торг</title>
  <meta name="description" content="7 дней на блошином рынке: торгуйтесь с продавцами, распознавайте подделки и перепродавайте с выгодой.">
  <meta name="theme-color" content="#efe2c8">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏺</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root { --paper: #efe2c8; --card: #fbf4e4; --ink: #2b2118; --muted: #7a6650; --line: #d8c6a4; --red: #c8402f; --green: #3d7a4a; --gold: #d99a2b; color-scheme: light; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--paper) repeating-linear-gradient(90deg, transparent 0 46px, rgba(120, 90, 50, 0.04) 46px 48px); color: var(--ink); font: 16px/1.45 Rubik, system-ui, sans-serif; }
    button { font: inherit; color: inherit; cursor: pointer; }
    .app { max-width: 640px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom)); }
    .top { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 10px; margin: 0 -16px 16px; padding: 10px 16px; background: rgba(239, 226, 200, 0.92); backdrop-filter: blur(6px); border-bottom: 2px dashed var(--line); }
    .top .day { font-weight: 800; }
    .top .money { margin-left: auto; font: 700 28px/1 Caveat, cursive; color: var(--green); }
    .top .bag { padding: 6px 10px; border: 2px solid var(--ink); border-radius: 10px; background: var(--card); font-weight: 700; font-size: 14px; }
    h1 { margin: 6px 0 4px; font-size: clamp(30px, 8vw, 42px); font-weight: 800; letter-spacing: -0.02em; }
    h2 { margin: 18px 0 10px; font-size: 20px; }
    .lead { margin: 0 0 14px; color: var(--muted); }
    .btn { display: block; width: 100%; padding: 14px 18px; border: 2px solid var(--ink); border-radius: 14px; background: var(--ink); color: var(--card); font-weight: 700; box-shadow: 3px 3px 0 rgba(43, 33, 24, 0.25); transition: transform 0.1s; }
    .btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 rgba(43, 33, 24, 0.25); }
    .btn--ghost { background: var(--card); color: var(--ink); }
    .btn--red { background: var(--red); border-color: var(--red); }
    .btn:disabled { opacity: 0.45; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    .people { display: grid; gap: 10px; }
    .person { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; border: 2px solid var(--ink); border-radius: 16px; background: var(--card); text-align: left; box-shadow: 3px 3px 0 rgba(43, 33, 24, 0.18); }
    .person:disabled { opacity: 0.5; box-shadow: none; }
    .person .ava { font-size: 40px; text-align: center; }
    .person small { display: block; color: var(--muted); }
    .tag { position: relative; padding: 6px 12px 6px 22px; background: #fff7d6; border: 2px solid var(--ink); border-radius: 4px 10px 10px 4px; font: 700 22px/1 Caveat, cursive; white-space: nowrap; }
    .tag::before { content: ''; position: absolute; left: 6px; top: 50%; width: 6px; height: 6px; margin-top: -3px; border-radius: 50%; border: 2px solid var(--ink); }
    .scene { padding: 18px; border: 2px solid var(--ink); border-radius: 22px; background: var(--card); box-shadow: 4px 4px 0 rgba(43, 33, 24, 0.2); }
    .who { display: flex; gap: 12px; align-items: center; }
    .who .ava { font-size: 54px; line-height: 1; }
    .who b { font-size: 19px; }
    .who small { display: block; color: var(--muted); }
    .hearts { margin-left: auto; font-size: 18px; letter-spacing: 2px; white-space: nowrap; }
    .bubble { position: relative; margin: 14px 0; padding: 12px 16px; border-radius: 16px; background: var(--ink); color: var(--card); font-weight: 500; }
    .bubble::before { content: ''; position: absolute; left: 26px; top: -8px; border: 8px solid transparent; border-top: 0; border-bottom-color: var(--ink); }
    .bubble.shake { animation: shake 0.35s; }
    @keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
    .item { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 12px; align-items: center; padding: 12px; border: 2px dashed var(--line); border-radius: 16px; }
    .item .emo { font-size: 52px; text-align: center; }
    .item b { display: block; font-size: 18px; }
    .est { font-size: 14px; color: var(--muted); }
    .est.fake { color: var(--red); font-weight: 700; }
    .est.real { color: var(--green); font-weight: 700; }
    .offer { margin-top: 16px; }
    .offer label { display: flex; justify-content: space-between; align-items: baseline; font-weight: 700; }
    .offer label span { font: 700 34px/1 Caveat, cursive; color: var(--red); }
    input[type=range] { width: 100%; margin: 12px 0 4px; accent-color: var(--red); }
    .quick { display: flex; gap: 6px; flex-wrap: wrap; }
    .quick button { flex: 1; padding: 8px 4px; border: 2px solid var(--line); border-radius: 10px; background: transparent; font-weight: 700; font-size: 14px; }
    .inv { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
    .inv div { padding: 10px; border: 2px solid var(--line); border-radius: 14px; background: var(--card); font-size: 14px; }
    .inv div span { font-size: 28px; display: block; }
    .inv div small { color: var(--muted); }
    .event { margin: 0 0 14px; padding: 12px 14px; border-radius: 14px; background: #fff7d6; border: 2px solid var(--gold); font-weight: 500; }
    .sum { display: grid; gap: 6px; margin: 12px 0; padding: 0; list-style: none; }
    .sum li { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
    .plus { color: var(--green); font-weight: 700; } .minus { color: var(--red); font-weight: 700; }
    .big { font: 700 clamp(56px, 16vw, 80px)/1 Caveat, cursive; color: var(--green); text-align: center; margin: 10px 0; }
    .rules { display: grid; gap: 10px; margin: 16px 0; padding: 0; list-style: none; }
    .rules li { display: grid; grid-template-columns: 34px 1fr; gap: 8px; }
    .rules li span { font-size: 24px; }
    .back { display: block; margin-top: 16px; text-align: center; color: var(--muted); }
    .fade { animation: fade 0.3s ease; }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } }
  </style>
</head>
<body>
<div class="app" id="app"></div>
<script>
(() => {
  const app = document.getElementById('app');
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = (arr) => arr[Math.random() * arr.length | 0];
  const r10 = (v) => Math.max(10, Math.round(v / 10) * 10);
  const fmt = (v) => `${Math.round(v).toLocaleString('ru-RU')} ₽`;
  const DAYS = 7;

  const ITEMS = [
    ['🫖', 'Самовар на углях', 3200, 'посуда'], ['💿', 'Пластинка 1967 года', 1500, 'музыка'], ['📷', 'Плёночный фотоаппарат', 2600, 'техника'],
    ['🎖️', 'Старый значок', 350, 'коллекции'], ['🍵', 'Фарфоровый сервиз', 2100, 'посуда'], ['🗺️', 'Карта 1912 года', 1300, 'бумага'],
    ['⌚', 'Механические часы', 4200, 'техника'], ['📼', 'Кассетный плеер', 1800, 'музыка'], ['📕', 'Книга с автографом', 1700, 'бумага'],
    ['🤖', 'Жестяной робот', 900, 'игрушки'], ['🏺', 'Расписная ваза', 1200, 'посуда'], ['🪙', 'Серебряная монета', 1600, 'коллекции'],
    ['🖼️', 'Картина маслом', 5200, 'искусство'], ['🎸', 'Акустическая гитара', 3600, 'музыка'], ['⌨️', 'Печатная машинка', 2900, 'техника'],
    ['☎️', 'Телефон с диском', 1300, 'техника'], ['🗿', 'Статуэтка', 1600, 'искусство'], ['🪔', 'Медная лампа', 1100, 'посуда'],
    ['📚', 'Подшивка комиксов', 700, 'бумага'], ['♟️', 'Резные шахматы', 1500, 'игрушки'], ['📻', 'Ламповый радиоприёмник', 2300, 'техника'],
    ['🧭', 'Морской компас', 900, 'коллекции'], ['✉️', 'Открытки 50-х', 450, 'бумага'], ['🧸', 'Плюшевый мишка', 600, 'игрушки'],
  ];

  // характеры продавцов: насколько уступают, сколько терпят, шанс подделки
  const SELLERS = [
    { ava: '👴', name: 'Дед Семён', kind: 'Простак', ask: [0.9, 1.25], min: [0.45, 0.6], pat: 4, fake: 0.05,
      say: { hi: 'Вот, с чердака достал. Сколько дадите?', near: 'Эх, ну добавьте ещё чуток…', mid: 'Маловато будет, сынок.', low: 'Это ж почти даром!', deal: 'Забирайте, пусть радует.', bye: 'Пойду я, устал торговаться.' } },
    { ava: '🧔', name: 'Жора', kind: 'Жадина', ask: [1.6, 2.0], min: [0.85, 1.0], pat: 3, fake: 0.1,
      say: { hi: 'Вещь редкая, торг неуместен. Ну почти.', near: 'Ладно, почти уговорили…', mid: 'Даже не близко.', low: 'Вы меня оскорбляете!', deal: 'Эх, от сердца отрываю.', bye: 'Всё, не продаю. Свободны.' } },
    { ava: '🏃', name: 'Лёша', kind: 'Торопыга', ask: [1.2, 1.5], min: [0.55, 0.7], pat: 2, fake: 0.1,
      say: { hi: 'Быстро решаем, у меня электричка!', near: 'Чуть-чуть ещё и по рукам!', mid: 'Не-не, давайте живее и щедрее.', low: 'Некогда мне шутить!', deal: 'Отлично, побежал!', bye: 'Всё, убегаю.' } },
    { ava: '🦊', name: 'Вадик', kind: 'Хитрец', ask: [1.3, 1.6], min: [0.7, 0.8], pat: 4, fake: 0.4,
      say: { hi: 'Подлинник, мамой клянусь. Почти.', near: 'Хм, интересное предложение…', mid: 'Ну вы же понимаете, вещь не простая.', low: 'Ха! Нет.', deal: 'Приятно иметь дело.', bye: 'Найду покупателя посговорчивее.' } },
    { ava: '👵', name: 'Баба Валя', kind: 'Добрая', ask: [1.0, 1.3], min: [0.5, 0.65], pat: 5, fake: 0,
      say: { hi: 'Это ещё от мужа осталось, берите, милок.', near: 'Ну ещё немножко, на хлебушек…', mid: 'Ой, маловато, внучок.', low: 'Да как же так…', deal: 'Носите на здоровье!', bye: 'Ладно, домой пойду.' } },
  ];
  const BUYERS = [
    { ava: '🧐', name: 'Коллекционер', want: 'category', max: [1.3, 1.6], pat: 3, sharp: true,
      say: { hi: 'Ищу кое-что для коллекции…', near: 'Дороговато, но вещь хорошая…', mid: 'Нет, это слишком.', low: 'Вы шутите?', deal: 'Беру! Отличное дополнение.', bye: 'Поищу у соседей.', fake: 'Это же подделка. Дам копейки.' } },
    { ava: '📸', name: 'Турист', want: 'any', max: [1.0, 1.35], pat: 2, sharp: false,
      say: { hi: 'О, какая прелесть! Сколько стоит?', near: 'Хм, немного дорого…', mid: 'Для сувенира многовато.', low: 'Ого! Нет-нет.', deal: 'Беру на память!', bye: 'Пойду ещё погуляю.' } },
    { ava: '🕶️', name: 'Перекупщик', want: 'top', max: [0.65, 0.85], pat: 4, sharp: true,
      say: { hi: 'Что есть ценного? Возьму оптом… ну или поштучно.', near: 'Почти договорились.', mid: 'Мне ещё перепродавать.', low: 'Несерьёзно.', deal: 'Договорились.', bye: 'Ладно, бывай.', fake: 'Фуфло. Могу забрать за копейки.' } },
    { ava: '🎒', name: 'Студентка', want: 'cheap', max: [0.6, 0.95], pat: 3, sharp: false, cap: 1500,
      say: { hi: 'Хочу что-нибудь необычное в комнату!', near: 'Ой, ну чуть-чуть дешевле?', mid: 'У меня столько нет…', low: 'Это же вся стипендия!', deal: 'Ура, спасибо!', bye: 'Ладно, в другой раз.' } },
  ];
  const EVENTS = [
    { text: '☀️ Хорошая погода — обычный день на рынке.', buyers: 3, mult: 1 },
    { text: '🌧️ Дождь: сегодня только два покупателя.', buyers: 2, mult: 1 },
    { text: '🎪 В городе ярмарка: покупатели щедрее на 20%.', buyers: 3, mult: 1.2 },
    { text: '📰 В газете статья про антиквариат: покупателей четыре.', buyers: 4, mult: 1.05 },
    { text: '🥶 Холодно и мало людей: покупатели прижимистые.', buyers: 3, mult: 0.85 },
  ];

  let S, H;
  let best = 0;
  try { best = +localStorage.getItem('flea-best') || 0; } catch {}

  function newItem() {
    const [emo, name, base, cat] = pick(ITEMS);
    const value = r10(base * rnd(0.7, 1.35));
    const spread = rnd(0.3, 0.5);
    return { emo, name, cat, value, fake: false, lo: r10(value * (1 - spread * rnd(0.4, 1))), hi: r10(value * (1 + spread * rnd(0.4, 1))), inspected: false };
  }

  function newGame() {
    S = { day: 1, money: 1000, inv: [], log: [], start: 1000 };
    morning();
  }

  function top() {
    return `<div class="top"><span class="day">День ${S.day}/${DAYS}</span><span class="bag">🎒 ${S.inv.length}</span><span class="money">${fmt(S.money)}</span></div>`;
  }

  // ---------- Утро: продавцы ----------
  function morning() {
    S.event = S.day === 1 ? EVENTS[0] : pick(EVENTS);
    S.dayStart = S.money;
    S.sellers = [...SELLERS].sort(() => Math.random() - 0.5).slice(0, 3).map((p) => {
      const it = newItem();
      if (Math.random() < p.fake) { it.fake = true; it.real = it.value; it.value = r10(it.value * 0.12); }
      const ask = r10((it.fake ? it.real : it.value) * rnd(...p.ask));
      const min = r10((it.fake ? it.real : it.value) * rnd(...p.min));
      return { p, it, ask, min, done: false };
    });
    renderMorning();
  }
  function renderMorning() {
    app.innerHTML = `${top()}<div class="fade"><h1>Утро, ряды открываются</h1>
      <p class="event">${S.event.text}</p>
      <p class="lead">Выберите, с кем торговаться. Купленное днём перепродадите у своего прилавка.</p>
      <div class="people">${S.sellers.map((s, i) => `
        <button class="person" data-s="${i}" ${s.done ? 'disabled' : ''}>
          <span class="ava">${s.p.ava}</span>
          <span><b>${s.it.emo} ${s.it.name}</b><small>${s.p.name} · ${s.p.kind}${s.done ? ' · ' + s.done : ''}</small></span>
          <span class="tag">${fmt(s.ask)}</span>
        </button>`).join('')}</div>
      ${invHtml()}
      <div style="margin-top:16px"><button class="btn" id="toStall">К своему прилавку →</button></div></div>`;
    app.querySelectorAll('[data-s]').forEach((b) => b.onclick = () => haggleBuy(S.sellers[+b.dataset.s]));
    document.getElementById('toStall').onclick = afternoon;
  }
  function invHtml() {
    if (!S.inv.length) return '';
    return `<h2>В сумке</h2><div class="inv">${S.inv.map((it) => `<div><span>${it.emo}</span>${it.name}<br><small>куплено за ${fmt(it.paid)}${it.inspected ? (it.fake ? ' · подделка' : ' · подлинник') : ''}</small></div>`).join('')}</div>`;
  }

  // ---------- Торг ----------
  function hearts() { return '❤️'.repeat(Math.max(0, H.pat)) + '🤍'.repeat(Math.max(0, H.maxPat - H.pat)); }
  function estHtml(it) {
    if (it.inspected) return it.fake ? `<div class="est fake">Подделка! Реально стоит около ${fmt(it.value)}</div>` : `<div class="est real">Подлинник · рыночная цена ${fmt(r10(it.value * 0.92))}–${fmt(r10(it.value * 1.08))}</div>`;
    return `<div class="est">Ваша оценка: ${fmt(it.lo)}–${fmt(it.hi)}</div>`;
  }
  function haggleBuy(seller) {
    H = { mode: 'buy', s: seller, p: seller.p, it: seller.it, their: seller.ask, limit: seller.min, pat: seller.p.pat, maxPat: seller.p.pat, msg: seller.p.say.hi, offer: 0 };
    H.offer = Math.max(10, Math.min(r10(H.their * 0.4), r10(S.money * 0.7)));
    renderHaggle();
  }
  function haggleSell(buyer, it) {
    const b = buyer.p;
    let max = it.value * rnd(...b.max) * S.event.mult;
    let msg = b.say.hi;
    if (it.fake && b.sharp) { max = it.value * 1.1; msg = b.say.fake; }
    else if (it.fake) max = it.real * rnd(...b.max) * S.event.mult; // не разбирается — платит как за подлинник
    if (b.cap) max = Math.min(max, b.cap);
    max = r10(max);
    H = { mode: 'sell', b: buyer, p: b, it, limit: max, their: r10(max * rnd(0.5, 0.7)), pat: b.pat, maxPat: b.pat, msg };
    H.offer = r10(Math.max(H.their * 1.6, it.paid * 1.3));
    renderHaggle();
  }
  function renderHaggle(shake) {
    const buy = H.mode === 'buy';
    const lo = buy ? 10 : H.their;
    const hi = buy ? Math.max(10, Math.min(S.money, H.their)) : r10(H.their * 3 + 200);
    H.offer = Math.min(hi, Math.max(lo, H.offer));
    app.innerHTML = `${top()}<div class="scene fade">
      <div class="who"><span class="ava">${H.p.ava}</span><div><b>${H.p.name}</b><small>${buy ? H.p.kind + ' · продаёт' : 'покупатель'}</small></div><span class="hearts" title="Терпение">${hearts()}</span></div>
      <div class="bubble ${shake ? 'shake' : ''}">${H.msg}</div>
      <div class="item"><span class="emo">${H.it.emo}</span><div><b>${H.it.name}</b>
        <div>${buy ? 'Просит' : 'Предлагает'}: <span class="tag" style="font-size:20px">${fmt(H.their)}</span></div>
        ${estHtml(H.it)}${!buy ? `<div class="est">Вы заплатили ${fmt(H.it.paid)}</div>` : ''}</div></div>
      <div class="offer">
        <label>${buy ? 'Ваше предложение' : 'Ваша цена'} <span id="ov">${fmt(H.offer)}</span></label>
        <input type="range" id="rng" min="${lo}" max="${hi}" step="10" value="${H.offer}">
        <div class="quick">${(buy ? [0.5, 0.65, 0.8, 0.9] : [1.1, 1.25, 1.5, 2]).map((k) => `<button data-k="${k}">${buy ? '−' + Math.round((1 - k) * 100) : '+' + Math.round((k - 1) * 100)}%</button>`).join('')}</div>
        ${buy && S.money < H.their ? `<p class="est">У вас только ${fmt(S.money)}.</p>` : ''}
      </div>
      <div class="row">
        <button class="btn" id="offer">${buy ? 'Предложить' : 'Назвать цену'}</button>
        <button class="btn btn--ghost" id="accept" ${buy && S.money < H.their ? 'disabled' : ''}>${buy ? 'Купить за' : 'Продать за'} ${fmt(H.their)}</button>
      </div>
      <div class="row">
        ${buy && !H.it.inspected ? '<button class="btn btn--ghost" id="inspect">🔍 Осмотреть (−❤️)</button>' : '<span></span>'}
        <button class="btn btn--ghost" id="leave">Уйти</button>
      </div></div>`;
    const rng = document.getElementById('rng');
    rng.oninput = () => { H.offer = +rng.value; document.getElementById('ov').textContent = fmt(H.offer); };
    app.querySelectorAll('[data-k]').forEach((b) => b.onclick = () => { H.offer = r10(H.their * +b.dataset.k); renderHaggle(); });
    document.getElementById('offer').onclick = makeOffer;
    document.getElementById('accept').onclick = () => close(true, H.their);
    document.getElementById('leave').onclick = () => close(false);
    const ins = document.getElementById('inspect');
    if (ins) ins.onclick = () => {
      H.it.inspected = true; H.pat--;
      H.msg = H.it.fake ? (H.p.kind === 'Хитрец' ? 'Э-э… ну, может, и не совсем подлинник.' : 'Я и сам не знал!') : 'Смотрите-смотрите, вещь честная.';
      if (H.it.fake) { H.limit = r10(H.it.value * 1.2); H.their = r10(Math.min(H.their, H.it.value * 2.5)); }
      if (H.pat <= 0) return giveUp();
      renderHaggle();
    };
  }
  function makeOffer() {
    const buy = H.mode === 'buy', say = H.p.say;
    const ratio = buy ? H.offer / H.limit : H.limit / H.offer; // 1+ — сделка
    if (ratio >= 1) return close(true, H.offer);
    let shake = false;
    if (ratio < 0.6) { H.pat -= 2; H.msg = say.low; shake = true; }
    else { H.pat--; H.msg = ratio > 0.88 ? say.near : say.mid; }
    if (H.pat <= 0) return giveUp();
    // встречное предложение сдвигается к вашему, но не дальше их предела
    const next = H.their + (H.offer - H.their) * (ratio > 0.88 ? 0.5 : 0.3);
    H.their = buy ? r10(Math.max(H.limit, next)) : r10(Math.min(H.limit, next));
    H.msg += ` Давайте ${fmt(H.their)}.`;
    renderHaggle(shake);
  }
  function giveUp() { H.msg = H.p.say.bye; close(false, 0, true); }
  function close(deal, price, angry) {
    if (H.mode === 'buy') {
      if (deal) {
        S.money -= price; H.it.paid = price; S.inv.push(H.it);
        S.log.push([`Купили: ${H.it.emo} ${H.it.name}`, -price]);
        H.s.done = 'куплено';
      } else H.s.done = angry ? 'ушёл' : 'пропущено';
      toast(deal ? H.p.say.deal : H.msg, renderMorning);
    } else {
      if (deal) {
        S.money += price; S.inv = S.inv.filter((x) => x !== H.it);
        S.log.push([`Продали: ${H.it.emo} ${H.it.name} (купили за ${fmt(H.it.paid)})`, price]);
      }
      toast(deal ? H.p.say.deal : H.msg, nextBuyer);
    }
  }
  function toast(text, then) {
    app.innerHTML = `${top()}<div class="scene fade"><div class="who"><span class="ava">${H.p.ava}</span><div><b>${H.p.name}</b></div></div><div class="bubble">${text}</div><button class="btn" id="ok">Дальше</button></div>`;
    document.getElementById('ok').onclick = then; document.getElementById('ok').focus();
  }

  // ---------- День: свой прилавок ----------
  function afternoon() {
    S.queue = Array.from({ length: S.event.buyers }, () => ({ p: pick(BUYERS) }));
    nextBuyer();
  }
  function nextBuyer() {
    const b = S.queue.shift();
    if (!b) return evening();
    if (!S.inv.length) { S.queue = []; return evening(); }
    let it;
    if (b.p.want === 'category') {
      const cat = pick(S.inv).cat;
      const options = S.inv.filter((x) => x.cat === cat);
      it = Math.random() < 0.75 ? pick(options) : null;
      if (!it) { H = { p: b.p }; return toast(`Ищу что-нибудь из раздела «${pick(['искусство', 'коллекции', 'техника'])}»… Нет? Жаль.`, nextBuyer); }
    } else if (b.p.want === 'top') it = [...S.inv].sort((a, c) => c.value - a.value)[0];
    else if (b.p.want === 'cheap') it = [...S.inv].sort((a, c) => a.value - c.value)[0];
    else it = pick(S.inv);
    haggleSell(b, it);
  }

  // ---------- Вечер ----------
  function evening() {
    const diff = S.money - S.dayStart;
    const todays = S.log.splice(0);
    const last = S.day >= DAYS;
    app.innerHTML = `${top()}<div class="fade"><h1>${last ? 'Рынок закрывается' : 'Вечер дня ' + S.day}</h1>
      <ul class="sum">${todays.map(([t, v]) => `<li><span>${t}</span><span class="${v > 0 ? 'plus' : 'minus'}">${v > 0 ? '+' : ''}${fmt(v)}</span></li>`).join('') || '<li><span>Сегодня без сделок</span><span>—</span></li>'}
        <li><b>Итог дня</b><b class="${diff >= 0 ? 'plus' : 'minus'}">${diff >= 0 ? '+' : ''}${fmt(diff)}</b></li></ul>
      ${invHtml()}
      <div style="margin-top:16px"><button class="btn" id="next">${last ? 'Подвести итоги' : 'Следующий день →'}</button></div></div>`;
    document.getElementById('next').onclick = () => { if (last) finish(); else { S.day++; morning(); } };
  }
  function finish() {
    const leftover = S.inv.reduce((s, it) => s + r10(it.value * 0.4), 0);
    const total = S.money + leftover;
    const rank = total < 1500 ? ['🐣', 'Новичок рынка'] : total < 3000 ? ['🧺', 'Бойкий торговец'] : total < 6000 ? ['🦈', 'Акула барахолки'] : ['👑', 'Легенда рынка'];
    const record = total > best;
    if (record) { best = total; try { localStorage.setItem('flea-best', best); } catch {} }
    app.innerHTML = `<div class="fade" style="text-align:center"><h1>${rank[0]} ${rank[1]}</h1>
      <p class="lead">Начали с 1 000 ₽. Остатки в сумке скупщик забрал за ${fmt(leftover)}.</p>
      <div class="big">${fmt(total)}</div>
      <p>${record ? '🏆 Новый рекорд!' : `Рекорд: ${fmt(best)}`}</p>
      <button class="btn" id="again">Сыграть ещё</button><a class="back" href="/">← Портфолио</a></div>`;
    document.getElementById('again').onclick = newGame;
  }

  // ---------- Старт ----------
  app.innerHTML = `<div class="fade"><h1>🏺 Барахолка</h1>
    <p class="lead">У вас 1 000 ₽ и 7 дней на блошином рынке. Покупайте дешевле, продавайте дороже.</p>
    <ul class="rules">
      <li><span>🗣️</span>У каждого продавца свой характер: простак уступит много, жадина почти ничего, торопыга быстро уйдёт.</li>
      <li><span>❤️</span>Каждое предложение тратит терпение. Слишком низкая цена злит вдвое сильнее.</li>
      <li><span>👂</span>Слушайте реплики: «добавьте чуток» значит, что вы почти у цели.</li>
      <li><span>🔍</span>У хитрецов бывают подделки. Осмотр раскрывает правду, но стоит терпения. Коллекционера и перекупщика подделкой не обманешь.</li>
    </ul>
    <button class="btn" id="start">Открыть рынок</button>
    ${best ? `<p class="lead" style="text-align:center;margin-top:12px">Рекорд: ${fmt(best)}</p>` : ''}
    <a class="back" href="/">← Портфолио</a></div>`;
  document.getElementById('start').onclick = newGame;
})();
</script>
</body>
</html>
